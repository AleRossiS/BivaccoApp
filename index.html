<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bivacco</title>

  <style>
    /* Color palette: change it here, it updates everywhere */
    :root {
      --bg: #10141a;      /* page background */
      --card: #1b222c;    /* card background */
      --fg: #e8edf3;      /* main text */
      --muted: #8a96a6;   /* secondary text (labels, units) */
      --acc: #f5a623;     /* accent color (buttons, chart) */
    }

    * { box-sizing: border-box; }

    body {
      margin: 0 auto;
      padding: 16px;
      max-width: 600px;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, sans-serif;
    }

    h1 { font-size: 1.3rem; margin: 0 0 4px; }
    #status { color: var(--muted); margin: 0 0 16px; }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .grid .card { margin-bottom: 0; }

    .label { color: var(--muted); font-size: 0.85rem; }
    .value { font-size: 1.8rem; font-weight: 600; }
    .unit  { color: var(--muted); font-size: 1rem; }

    canvas { width: 100%; height: 180px; display: block; margin-top: 8px; }

    .buttons { display: flex; gap: 12px; margin-top: 4px; }
    button {
      flex: 1;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      background: var(--acc);
      color: #000;
    }
    button.secondary { background: var(--card); color: var(--fg); }
  </style>
</head>
<body>
  <h1>Bivacco – energia</h1>
  <p id="status">Non connesso</p>

  <!-- The 4 value cards -->
  <div class="grid">
    <div class="card">
      <div class="label">Potenza</div>
      <span class="value" id="p">–</span> <span class="unit">mW</span>
    </div>
    <div class="card">
      <div class="label">Tensione</div>
      <span class="value" id="v">–</span> <span class="unit">V</span>
    </div>
    <div class="card">
      <div class="label">Corrente</div>
      <span class="value" id="i">–</span> <span class="unit">mA</span>
    </div>
    <div class="card">
      <div class="label">DAC</div>
      <span class="value" id="dac">–</span>
    </div>
  </div>

  <!-- Power chart -->
  <div class="card">
    <div class="label">Potenza nel tempo</div>
    <canvas id="chart"></canvas>
  </div>

  <!-- Buttons -->
  <div class="buttons">
    <button id="btnConnect">Connetti</button>
    <button id="btnDemo" class="secondary">Demo</button>
  </div>
</body>
</html>

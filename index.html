<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bivacco</title>

  <style>
    /* Color palette: change it here, it updates everywhere */
    :root {
      --bg: #10141a;      /* page background */
      --card: #1b222c;    /* card background */
      --fg: #e8edf3;      /* main text */
      --muted: #8a96a6;   /* secondary text (labels, units) */
      --acc: #f5a623;     /* accent color (buttons, chart) */
    }

    * { box-sizing: border-box; }

    body {
      margin: 0 auto;
      padding: 16px;
      max-width: 600px;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, sans-serif;
    }

    h1 { font-size: 1.3rem; margin: 0 0 4px; }
    #status { color: var(--muted); margin: 0 0 16px; }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .grid .card { margin-bottom: 0; }

    .label { color: var(--muted); font-size: 0.85rem; }
    .value { font-size: 1.8rem; font-weight: 600; }
    .unit  { color: var(--muted); font-size: 1rem; }

    canvas { width: 100%; height: 180px; display: block; margin-top: 8px; }

    .buttons { display: flex; gap: 12px; margin-top: 4px; }
    button {
      flex: 1;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      background: var(--acc);
      color: #000;
    }
    button.secondary { background: var(--card); color: var(--fg); }
  </style>
</head>
<body>
  <h1>Bivacco – Energy</h1>
  <p id="status">Not connected</p>

  <!-- The 4 value cards -->
  <div class="grid">
    <div class="card">
      <div class="label">Power</div>
      <span class="value" id="p">–</span> <span class="unit">mW</span>
    </div>
    <div class="card">
      <div class="label">Voltage</div>
      <span class="value" id="v">–</span> <span class="unit">V</span>
    </div>
    <div class="card">
      <div class="label">Current</div>
      <span class="value" id="i">–</span> <span class="unit">mA</span>
    </div>
    <div class="card">
      <div class="label">DAC</div>
      <span class="value" id="dac">–</span>
    </div>
  </div>

  <!-- Power chart -->
  <div class="card">
    <div class="label">Power over time</div>
    <canvas id="chart"></canvas>
  </div>

  <!-- Buttons -->
  <div class="buttons">
    <button id="btnConnect">Connect</button>
    <button id="btnDemo" class="secondary">Demo</button>
  </div>

  <script>
    // ---- Chart history ----
    const N_POINTS = 60;     // points kept: 60 x 2 s = 2 minutes
    const history = [];      // last N_POINTS power values [mW]

    // ---- BLE contract (must match config.h on the ESP32) ----
    const SERVICE_UUID = '995e0001-c4d9-4154-8b60-ab9747017a4f';
    const CHAR_UUID    = '995e0002-c4d9-4154-8b60-ab9747017a4f';

    /* Write a status line under the title. */
    function setStatus(text) {
      document.getElementById('status').textContent = text;
    }

    /* Show one sample in the 4 cards and add it to the chart. */
    function showSample(v, i, p, dac) {
      document.getElementById('v').textContent   = v.toFixed(3);
      document.getElementById('i').textContent   = i.toFixed(1);
      document.getElementById('p').textContent   = p.toFixed(2);
      document.getElementById('dac').textContent = dac.toFixed(0);

      if (Number.isFinite(p)) {             // skip invalid readings (NaN from the INA)
        history.push(p);                    // add the newest value at the end
        if (history.length > N_POINTS) {
          history.shift();                  // drop the oldest (first) one
        }
      }
      drawChart();
    }

    /* Draw history[] as a line on the canvas, P axis from 0 to the max. */
    function drawChart() {
      const canvas = document.getElementById('chart');
      const ctx = canvas.getContext('2d');

      // Match the drawing resolution to the real screen pixels (sharp on iPhone)
      const dpr = window.devicePixelRatio || 1;
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      canvas.width  = w * dpr;              // this also clears the canvas
      canvas.height = h * dpr;
      ctx.scale(dpr, dpr);                  // from now on, draw in CSS pixels

      if (history.length < 2) return;       // a line needs at least 2 points

      const pMax = Math.max(...history, 1) * 1.1;   // at least 1 mW full scale: avoids 0/0

      // Line
      ctx.beginPath();
      for (let k = 0; k < history.length; k++) {
        const x = k / (N_POINTS - 1) * w;
        const y = h - history[k] / pMax * h;
        if (k === 0) ctx.moveTo(x, y);
        else         ctx.lineTo(x, y);
      }
      ctx.strokeStyle = '#f5a623';          // same as --acc
      ctx.lineWidth = 2;
      ctx.stroke();

      // Scale label
      ctx.fillStyle = '#8a96a6';            // same as --muted
      ctx.font = '12px system-ui';
      ctx.fillText('max ' + Math.max(...history).toFixed(1) + ' mW', 4, 12);
    }

    // ---- Demo mode: fake data from the Thevenin model of the test rig ----
    const V0 = 2.07;    // [V]   open-circuit voltage
    const R  = 50.4;    // [ohm] internal resistance
    let demoTimer = null;   // id of the running timer, null = demo off

    /* One fake sample: DAC wanders around the MPP like P&O does, V and I follow the model. */
    function demoSample() {
      const dac = 72 + 2 * Math.floor(Math.random() * 4);              // 72, 74, 76 or 78
      const i = 19.5 + 0.8 * (dac - 74) + (Math.random() - 0.5) * 0.2; // [mA]
      const v = V0 - R * i / 1000;                                     // [V]
      const p = v * i;                                                 // [mW]
      showSample(v, i, p, dac);
    }

    /* Start/stop the demo (called when the Demo button is pressed). */
    function toggleDemo() {
      const btn = document.getElementById('btnDemo');
      if (demoTimer !== null) {          // demo running -> stop it
        clearInterval(demoTimer);
        demoTimer = null;
        btn.textContent = 'Demo';
        setStatus('Not connected');
        return;
      }
      demoTimer = setInterval(demoSample, 2000);   // call demoSample every 2 s
      demoSample();                                // first sample right away
      btn.textContent = 'Stop demo';
      setStatus('Demo (simulated data)');
    }

    /* Decode the 16-byte payload (4 little-endian floats) and show it. */
    function showPayload(dv) {
      const v   = dv.getFloat32(0,  true);
      const i   = dv.getFloat32(4,  true);
      const p   = dv.getFloat32(8,  true);
      const dac = dv.getFloat32(12, true);
      showSample(v, i, p, dac);
    }

    /* Called by the browser on every notification from the ESP32. */
    function onData(event) {
      showPayload(event.target.value);
    }

    /* Called by the browser when the connection is lost. */
    function onDisconnected() {
      setStatus('Disconnected');
    }

    /* Connect to the ESP32, read the current value, subscribe to notifications. */
    async function connectBle() {
      if (!navigator.bluetooth) {
        setStatus('Bluetooth not available: use Chrome (PC/Android) or Bluefy (iPhone)');
        return;
      }
      if (demoTimer !== null) toggleDemo();     // stop the demo: real data is coming

      try {
        setStatus('Searching...');
        const device = await navigator.bluetooth.requestDevice({
          filters: [{ services: [SERVICE_UUID] }]
        });
        device.addEventListener('gattserverdisconnected', onDisconnected);

        setStatus('Connecting to ' + device.name + '...');
        const server  = await device.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        const ch      = await service.getCharacteristic(CHAR_UUID);

        showPayload(await ch.readValue());      // show the current value right away (READ)

        ch.addEventListener('characteristicvaluechanged', onData);
        await ch.startNotifications();          // writes 01 00 into the CCCD
        setStatus('Connected to ' + device.name);
      } catch (err) {
        setStatus('Error: ' + err.message);
      }
    }

    // ---- Wire the buttons to the functions ----
    document.getElementById('btnDemo').addEventListener('click', toggleDemo);
    document.getElementById('btnConnect').addEventListener('click', connectBle);
  </script>
</body>
</html>
